openapi: 3.1.0
info:
  title: Space Mission Design Game API
  version: 0.2.0
  description: |
    Machine-readable form of docs/api.md (D60), contract version 2 (task 015). If they
    disagree, docs/api.md wins and this file is fixed in the same task. Player-facing texts
    are message codes with params; the frontend translates them. Units are in field names.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5080
    description: Local backend
security: []
tags:
  - name: system
    description: Health check and server wake-up
  - name: missions
    description: Missions with goals, limits and catalogs
  - name: game
    description: Instant evaluation and simulation of a design
  - name: attempts
    description: Saved attempts of an anonymous player
paths:
  /api/health:
    get:
      tags: [system]
      summary: Health check and server wake-up
      operationId: getHealth
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/missions:
    get:
      tags: [missions]
      summary: List missions
      operationId: listMissions
      responses:
        '200':
          description: Missions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MissionSummary' }
  /api/missions/{id}:
    get:
      tags: [missions]
      summary: Mission with goal, limits, timing and catalogs
      operationId: getMission
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: sat-orbit }
      responses:
        '200':
          description: Mission with goal, limits, timing and catalogs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/evaluate:
    post:
      tags: [game]
      summary: Instant consequences of a design
      operationId: evaluateDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Design' }
      responses:
        '200':
          description: Instant consequences of the design
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evaluation' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
  /api/simulate:
    post:
      tags: [game]
      summary: Simulate the mission over time and build the report
      operationId: simulateMission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRequest' }
      responses:
        '200':
          description: Time series, ground track, contacts, events and report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
  /api/attempts:
    post:
      tags: [attempts]
      summary: Simulate and save an attempt
      operationId: saveAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptRequest' }
      responses:
        '201':
          description: Saved attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptSummary' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
    get:
      tags: [attempts]
      summary: Player's attempts, newest first
      operationId: listAttempts
      parameters:
        - { name: playerId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Newest first, at most 20
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: '#/components/schemas/AttemptSummary' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
  /api/attempts/{id}:
    get:
      tags: [attempts]
      summary: One attempt with its full result
      operationId: getAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Attempt with full result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: Invalid request; errors map field paths to design.* message codes
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }

    MissionKind: { type: string, enum: [tutorial, orbit, iss] }
    Segment: { type: string, enum: [launch, space, ground, user] }
    CheckSegment: { type: string, enum: [launch, space, ground, user, mission] }
    Status: { type: string, enum: [ok, warn, fail] }
    Role: { type: string, enum: [engineer, designer, planner, scientist] }
    ResourceKind: { type: string, enum: [mass, power, budget, data, comms, time] }
    Tier: { type: string, enum: [basic, medium, best] }
    Value: { type: string, enum: [low, medium, high, highest] }
    Band: { type: string, enum: [uhf, s, x] }
    PartCategory: { type: string, enum: [bus, solar, battery, radio, computer, adcs, propulsion] }
    BusSize: { type: string, enum: [small, medium, large], description: Bus class vs launcher fairing (D93) }
    Side:
      type: string
      enum: [earth, space, sun, inside]
      description: Side of the bus a part faces (D93)
    Params:
      type: object
      additionalProperties: { oneOf: [{ type: number }, { type: string }] }

    Message:
      type: object
      required: [code, params]
      properties:
        code: { type: string, example: comment.engineer.powerMarginLow }
        params: { $ref: '#/components/schemas/Params' }

    Source:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [nasa, nasaRetold, estimate, calculated] }
        note: { type: [string, 'null'] }
        url: { type: [string, 'null'] }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    MissionSummary:
      type: object
      required: [id, kind, titleCode, available]
      properties:
        id: { type: string, examples: [cubesat-learn, sat-orbit, iss-cargo] }
        kind: { $ref: '#/components/schemas/MissionKind' }
        titleCode: { type: string }
        available: { type: boolean }

    Orbit:
      type: object
      required: [id, nameCode, altitudeKm, inclinationDeg, epochDate, source]
      properties:
        id: { type: string, examples: [leo, sso, meo, geo, iss, iss-deploy] }
        nameCode: { type: string }
        altitudeKm: { type: number }
        inclinationDeg: { type: number }
        epochDate:
          description: Date of the NASA trajectory file the orbit comes from (ISS OEM), else null
          type: [string, 'null']
          format: date
        source: { $ref: '#/components/schemas/Source' }

    Launch:
      type: object
      required: [id, nameCode, priceK, capacityKg, fixedOrbitId, maxBusSize, source]
      properties:
        id: { type: string, examples: [rideshare, small, medium] }
        nameCode: { type: string }
        priceK: { type: number }
        capacityKg:
          description: Capacity per orbit id; for iss missions the key is "iss" (insertion in the ISS plane)
          type: object
          additionalProperties: { type: number }
        fixedOrbitId: { type: [string, 'null'] }
        maxBusSize: { $ref: '#/components/schemas/BusSize' }
        source: { $ref: '#/components/schemas/Source' }

    Requirement:
      type: object
      required: [category, partId]
      properties:
        category: { $ref: '#/components/schemas/PartCategory' }
        partId: { type: string }

    PartSpecs:
      type: object
      properties:
        maxMassKg: { type: number }
        slots: { type: integer }
        dragAreaM2: { type: number }
        busSize: { $ref: '#/components/schemas/BusSize' }
        powerW: { type: number, description: 'solar: generation; propulsion: consumption while firing' }
        capacityWh: { type: number }
        rateKbps: { type: number, description: Rated rate at the 1000 km reference distance (D80) }
        band: { $ref: '#/components/schemas/Band' }
        storageGb: { type: number }
        accuracyDeg: { type: number }
        ispS: { type: number }
        thrustN: { type: number }
        propellantKg: { type: number, description: 'Propellant in the tank, on top of dry massKg' }

    Part:
      type: object
      required: [id, category, tier, nameCode, massKg, priceK, consumptionW, specs, requires, source]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/PartCategory' }
        tier: { $ref: '#/components/schemas/Tier' }
        nameCode: { type: string }
        massKg: { type: number }
        priceK: { type: number }
        consumptionW: { type: number }
        specs: { $ref: '#/components/schemas/PartSpecs' }
        requires: { type: array, items: { $ref: '#/components/schemas/Requirement' } }
        source: { $ref: '#/components/schemas/Source' }

    Instrument:
      type: object
      required: [id, nameCode, tier, massKg, priceK, consumptionW, dataRateKbps, value, requires, source]
      properties:
        id: { type: string, examples: [magnetometer, radiometer, camera, radar] }
        nameCode: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        massKg: { type: number }
        priceK: { type: number }
        consumptionW: { type: number }
        dataRateKbps: { type: number }
        value: { $ref: '#/components/schemas/Value' }
        requires: { type: array, items: { $ref: '#/components/schemas/Requirement' } }
        source: { $ref: '#/components/schemas/Source' }

    GroundStation:
      type: object
      required: [id, nameCode, latitudeDeg, longitudeDeg, bands, priceK, source]
      properties:
        id: { type: string, examples: [fairbanks, white-sands, guam] }
        nameCode: { type: string }
        latitudeDeg: { type: number }
        longitudeDeg: { type: number, description: East positive }
        bands: { type: array, items: { $ref: '#/components/schemas/Band' } }
        priceK: { type: number }
        source: { $ref: '#/components/schemas/Source' }

    LaunchSite:
      type: object
      required: [id, nameCode, latitudeDeg, longitudeDeg, source]
      properties:
        id: { type: string, examples: [cape-canaveral, wallops] }
        nameCode: { type: string }
        latitudeDeg: { type: number }
        longitudeDeg: { type: number }
        source: { $ref: '#/components/schemas/Source' }

    CargoCategory:
      type: object
      required: [id, nameCode, value, typicalMassKg, source]
      properties:
        id: { type: string, examples: [science, crew-supplies] }
        nameCode: { type: string }
        value: { $ref: '#/components/schemas/Value' }
        typicalMassKg: { type: number }
        source: { $ref: '#/components/schemas/Source' }

    OrbitChoice:
      oneOf:
        - type: object
          required: [presetId]
          properties: { presetId: { type: string } }
        - type: object
          required: [altitudeKm, inclinationDeg]
          properties:
            altitudeKm: { type: number }
            inclinationDeg: { type: number }

    CargoItem:
      type: object
      required: [categoryId, massKg]
      properties:
        categoryId: { type: string }
        massKg: { type: number, minimum: 0 }

    Design:
      description: |
        For kind tutorial/orbit, orbit is required and the iss-only fields are absent.
        For kind iss, orbit is null and launchSiteId, insertionAltitudeKm, cargo and relay
        are required (design.issFieldRequired / design.issFieldNotAllowed).
      type: object
      required: [missionId, version, orbit, launchId, parts, instrumentIds, groundStationIds]
      properties:
        missionId: { type: string }
        version: { type: string, enum: [simple, advanced] }
        orbit:
          oneOf:
            - { $ref: '#/components/schemas/OrbitChoice' }
            - { type: 'null' }
        launchId: { type: string }
        parts:
          type: object
          required: [bus, solar, battery, radio, computer, adcs, propulsion]
          properties:
            bus: { type: string }
            solar: { type: string }
            battery: { type: string }
            radio: { type: string }
            computer: { type: string }
            adcs: { type: string }
            propulsion: { type: string, examples: [prop-none, prop-cold, prop-chem, prop-elec] }
        instrumentIds: { type: array, items: { type: string } }
        groundStationIds: { type: array, items: { type: string } }
        launchSiteId: { type: string, description: iss only }
        insertionAltitudeKm: { type: number, description: iss only }
        cargo: { type: array, items: { $ref: '#/components/schemas/CargoItem' }, description: iss only }
        relay: { type: boolean, description: 'iss only: TDRS relay instead of ground stations only' }
        layout:
          description: |
            Advanced version only (D93): side per part category (except bus) or instrument id.
            Missing keys are placed automatically. Absent or null in simple.
          oneOf:
            - type: object
              additionalProperties: { $ref: '#/components/schemas/Side' }
            - { type: 'null' }
        massReservePct:
          description: 'Advanced version only (D93): mass reserve; null means limits.massReserveRecommendedPct'
          type: [number, 'null']
          minimum: 0
          maximum: 50

    Preset:
      type: object
      required: [id, nameCode, design]
      properties:
        id: { type: string }
        nameCode: { type: string }
        design: { $ref: '#/components/schemas/Design' }

    DataGoal:
      type: object
      required: [dataGb, operationMonths]
      properties:
        dataGb: { type: number }
        operationMonths: { type: integer }

    CargoGoal:
      type: object
      required: [cargoKg, scienceCargoMinPct, dockingDeadlineDays]
      properties:
        cargoKg: { type: number }
        scienceCargoMinPct: { type: number }
        dockingDeadlineDays: { type: number }

    Mission:
      type: object
      required: [id, kind, titleCode, briefingCode, goal, limits, timing, catalogs, presets]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/MissionKind' }
        titleCode: { type: string }
        briefingCode: { type: string }
        goal:
          description: DataGoal for tutorial and orbit, CargoGoal for iss
          oneOf:
            - { $ref: '#/components/schemas/DataGoal' }
            - { $ref: '#/components/schemas/CargoGoal' }
        limits:
          type: object
          required: [budgetK, launchDeadlineMonth, massReserveRecommendedPct]
          properties:
            budgetK: { type: number }
            launchDeadlineMonth: { type: integer }
            massReserveRecommendedPct: { type: number, description: NASA early-phase mass reserve (D93) }
        timing:
          type: object
          required: [buildMonths, integrationMonths, rideshareMonths, launchLeadMonths]
          properties:
            buildMonths:
              type: object
              properties: { basic: { type: integer }, medium: { type: integer }, best: { type: integer } }
            integrationMonths: { type: integer }
            rideshareMonths: { type: array, items: { type: integer } }
            launchLeadMonths: { type: object, additionalProperties: { type: integer } }
        catalogs:
          type: object
          required: [orbits, launches, parts, instruments, groundStations, launchSites, cargoCategories]
          properties:
            orbits: { type: array, items: { $ref: '#/components/schemas/Orbit' } }
            launches: { type: array, items: { $ref: '#/components/schemas/Launch' } }
            parts: { type: array, items: { $ref: '#/components/schemas/Part' } }
            instruments: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
            groundStations: { type: array, items: { $ref: '#/components/schemas/GroundStation' } }
            launchSites: { type: array, items: { $ref: '#/components/schemas/LaunchSite' } }
            cargoCategories: { type: array, items: { $ref: '#/components/schemas/CargoCategory' } }
        presets: { type: array, items: { $ref: '#/components/schemas/Preset' } }

    Check:
      type: object
      required: [segment, status, code, params]
      properties:
        segment: { $ref: '#/components/schemas/CheckSegment' }
        status: { $ref: '#/components/schemas/Status' }
        code: { type: string }
        params: { $ref: '#/components/schemas/Params' }

    RoleComment:
      type: object
      required: [role, severity, message, advice]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        severity: { type: string, enum: [info, warn] }
        message: { $ref: '#/components/schemas/Message' }
        advice:
          description: Only in the simple version (D48); null in advanced
          oneOf: [{ $ref: '#/components/schemas/Message' }, { type: 'null' }]

    PropellantResource:
      type: object
      required: [neededKg, capacityKg, deltaVms]
      properties:
        neededKg: { type: number }
        capacityKg: { type: number }
        deltaVms: { type: number, description: Total delta-v in m/s }

    CargoResource:
      type: object
      required: [loadedKg, scienceKg, sciencePct, goalKg, scienceMinPct]
      properties:
        loadedKg: { type: number }
        scienceKg: { type: number }
        sciencePct: { type: number }
        goalKg: { type: number }
        scienceMinPct: { type: number }

    DataResource:
      type: object
      required: [generatedGbPerDay, downlinkGbPerDay, storageGb, expectedTotalGb, goalGb]
      properties:
        generatedGbPerDay: { type: number }
        downlinkGbPerDay: { type: number }
        storageGb: { type: number }
        expectedTotalGb: { type: number }
        goalGb: { type: number }

    RendezvousEstimate:
      type: object
      required: [hohmannDeltaVms, phasingDays, planeChangeDeltaVms]
      properties:
        hohmannDeltaVms: { type: number }
        phasingDays: { type: number }
        planeChangeDeltaVms: { type: number }

    CalcValue:
      type: object
      required: [name, value, unit]
      properties:
        name: { type: string, example: E_ecl }
        value: { type: number }
        unit: { type: string, description: 'Unit symbol; empty for dimensionless', example: Wh }

    CalcSheet:
      description: Calculation sheet (D94) - formula, substituted numbers, result and NASA source
      type: object
      required: [code, resource, formula, inputs, result, summary, source]
      properties:
        code: { type: string, example: calc.power.eclipseBattery }
        resource:
          type: string
          enum: [mass, power, budget, data, comms, time, orbit, propellant, rendezvous]
        formula: { type: string, example: 'E_ecl = P_ecl · T · f' }
        inputs: { type: array, items: { $ref: '#/components/schemas/CalcValue' } }
        result: { $ref: '#/components/schemas/CalcValue' }
        summary: { $ref: '#/components/schemas/Message' }
        source: { $ref: '#/components/schemas/Source' }

    StripContact:
      type: object
      required: [stationId, startMin, endMin]
      properties:
        stationId: { type: string, description: 'Ground station id, or "tdrs" for the relay' }
        startMin: { type: number }
        endMin: { type: number }

    OrbitStrip:
      description: One orbit for the light/shadow and contacts strip (D94); worst case beta = 0
      type: object
      required: [periodMin, eclipse, contacts]
      properties:
        periodMin: { type: number }
        eclipse:
          oneOf:
            - type: object
              required: [startMin, endMin]
              properties:
                startMin: { type: number }
                endMin: { type: number }
            - { type: 'null' }
        contacts: { type: array, items: { $ref: '#/components/schemas/StripContact' } }

    Evaluation:
      type: object
      required: [orbit, resources, rendezvous, layout, orbitStrip, calc, checks, comments]
      properties:
        orbit:
          type: object
          required: [altitudeKm, inclinationDeg, periodMin, speedKmS, eclipseFraction, lifetimeYears, disposalYears]
          properties:
            altitudeKm: { type: number }
            inclinationDeg: { type: number }
            periodMin: { type: number }
            speedKmS: { type: number }
            eclipseFraction: { type: number, minimum: 0, maximum: 1 }
            lifetimeYears: { type: [number, 'null'], description: Orbit lifetime without manoeuvres; null for iss }
            disposalYears: { type: [number, 'null'], description: Years to re-entry after end of mission with disposal burn; null for iss }
        resources:
          type: object
          required: [mass, power, budget, data, comms, time, propellant, cargo]
          properties:
            mass:
              type: object
              properties:
                usedKg: { type: number }
                busMaxKg: { type: number }
                launchCapacityKg: { type: number }
                slotsUsed: { type: integer }
                slots: { type: integer }
                reservePct: { type: number }
                reserveKg: { type: number }
                withReserveKg: { type: number, description: Checked against launchCapacityKg }
                recommendedReservePct: { type: number }
            power:
              type: object
              properties:
                generationW: { type: number }
                averageGenerationW: { type: number }
                averageConsumptionW: { type: number }
                eclipseNeedWh: { type: number }
                batteryWh: { type: number }
            budget:
              type: object
              properties: { usedK: { type: number }, limitK: { type: number } }
            data:
              description: tutorial and orbit only; null for iss
              oneOf: [{ $ref: '#/components/schemas/DataResource' }, { type: 'null' }]
            comms:
              type: object
              properties:
                contactsPerDay: { type: number }
                contactMinutesPerDay: { type: number }
            time:
              type: object
              properties:
                readyMonth: { type: integer }
                launchMonth: { type: integer }
                deadlineMonth: { type: integer }
            propellant: { $ref: '#/components/schemas/PropellantResource' }
            cargo:
              description: iss only; null otherwise
              oneOf: [{ $ref: '#/components/schemas/CargoResource' }, { type: 'null' }]
        rendezvous:
          description: iss only; null otherwise
          oneOf: [{ $ref: '#/components/schemas/RendezvousEstimate' }, { type: 'null' }]
        layout:
          description: Resolved side of every part and instrument after automatic placement
          type: object
          additionalProperties: { $ref: '#/components/schemas/Side' }
        orbitStrip: { $ref: '#/components/schemas/OrbitStrip' }
        calc: { type: array, items: { $ref: '#/components/schemas/CalcSheet' } }
        checks: { type: array, items: { $ref: '#/components/schemas/Check' } }
        comments: { type: array, items: { $ref: '#/components/schemas/RoleComment' } }

    SimulationRequest:
      type: object
      required: [design]
      properties:
        design: { $ref: '#/components/schemas/Design' }
        seed: { type: integer, format: int64 }

    ChainLink:
      type: object
      required: [kind, code, params]
      properties:
        kind: { type: string, enum: [decision, physics, consequence] }
        code: { type: string }
        params: { $ref: '#/components/schemas/Params' }
        formula: { type: string }

    Score:
      type: object
      required: [value, formula]
      properties:
        value: { type: integer, minimum: 0, maximum: 100 }
        formula: { type: string, description: Formula shown next to the score (D82) }

    Scores:
      type: object
      required: [missionSuccess, scienceValue, resourceEfficiency, decisionQuality]
      properties:
        missionSuccess: { $ref: '#/components/schemas/Score' }
        scienceValue: { $ref: '#/components/schemas/Score' }
        resourceEfficiency: { $ref: '#/components/schemas/Score' }
        decisionQuality: { $ref: '#/components/schemas/Score' }

    Bottleneck:
      type: object
      required: [resource, code, params]
      properties:
        resource: { $ref: '#/components/schemas/ResourceKind' }
        code: { type: string }
        params: { $ref: '#/components/schemas/Params' }

    Comparison:
      type: object
      required: [kind, missionId, nameCode, deltas, source]
      properties:
        kind: { type: string, enum: [real, modeled] }
        missionId: { type: string }
        nameCode: { type: string }
        deltas:
          description: Player design minus reference mission; only keys present in both
          type: object
          properties:
            altitudeKm: { type: number }
            inclinationDeg: { type: number }
            massKg: { type: number }
            dataGb: { type: number }
            cargoKg: { type: number }
            budgetK: { type: number }
          additionalProperties: false
        source:
          description: Source of the real mission's numbers; null for modeled
          oneOf: [{ $ref: '#/components/schemas/Source' }, { type: 'null' }]

    Report:
      type: object
      required: [success, scores, limits, segments, bottleneck, comparison]
      properties:
        success: { type: boolean }
        scores: { $ref: '#/components/schemas/Scores' }
        limits:
          type: array
          items:
            type: object
            required: [status, code, params]
            properties:
              status: { $ref: '#/components/schemas/Status' }
              code: { type: string }
              params: { $ref: '#/components/schemas/Params' }
        segments:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [segment, status, chain]
            properties:
              segment: { $ref: '#/components/schemas/Segment' }
              status: { $ref: '#/components/schemas/Status' }
              chain: { type: array, items: { $ref: '#/components/schemas/ChainLink' } }
        bottleneck: { $ref: '#/components/schemas/Bottleneck' }
        comparison:
          description: Closest reference mission (D85); null if the library is empty
          oneOf: [{ $ref: '#/components/schemas/Comparison' }, { type: 'null' }]

    SeededSource:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: seeded }

    DonkiSource:
      type: object
      required: [kind, eventId, observedAt, kp, periodStart, periodEnd]
      properties:
        kind: { type: string, const: donki }
        eventId: { type: [string, 'null'], description: DONKI gstID; null for spaceWeatherUnavailable }
        observedAt: { type: [string, 'null'], format: date-time }
        kp: { type: [number, 'null'], minimum: 0, maximum: 9 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }

    MissionEvent:
      type: object
      required: [day, type, segment, message, source]
      properties:
        day: { type: integer }
        type: { type: string, enum: [solarStorm, debris, failure, reentry, spaceWeatherUnavailable] }
        segment: { $ref: '#/components/schemas/Segment' }
        message: { $ref: '#/components/schemas/Message' }
        source:
          oneOf:
            - { $ref: '#/components/schemas/DonkiSource' }
            - { $ref: '#/components/schemas/SeededSource' }

    Timeline:
      type: object
      required: [stepDays, days, batteryMinPct, dataStoredGb, dataDeliveredGb, altitudeKm, propellantKg]
      properties:
        stepDays: { type: integer }
        days: { type: array, items: { type: integer } }
        batteryMinPct: { type: array, items: { type: number } }
        dataStoredGb: { type: array, items: { type: number } }
        dataDeliveredGb: { type: array, items: { type: number } }
        altitudeKm: { type: array, items: { type: number } }
        propellantKg: { type: array, items: { type: number } }

    GroundTrack:
      type: object
      required: [stepSeconds, orbitCount, points]
      properties:
        stepSeconds: { type: integer }
        orbitCount: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [latDeg, lonDeg, sunlit]
            properties:
              latDeg: { type: number }
              lonDeg: { type: number }
              sunlit: { type: boolean }

    Contact:
      type: object
      required: [stationId, contactsPerDay, minutesPerDay, visibilityRadiusDeg]
      properties:
        stationId: { type: string, description: 'Ground station id, or "tdrs" for the relay' }
        contactsPerDay: { type: number }
        minutesPerDay: { type: number }
        visibilityRadiusDeg: { type: [number, 'null'], description: Station zone radius at the 10 deg mask; null for tdrs }

    RendezvousProfile:
      type: object
      required: [initialPhaseAngleDeg, stepHours, hours, phaseAngleDeg, altitudeKm, propellantKg, dockedAtHours]
      properties:
        initialPhaseAngleDeg: { type: number }
        stepHours: { type: number }
        hours: { type: array, items: { type: number } }
        phaseAngleDeg: { type: array, items: { type: number } }
        altitudeKm: { type: array, items: { type: number } }
        propellantKg: { type: array, items: { type: number } }
        dockedAtHours: { type: [number, 'null'] }

    SimulationResult:
      type: object
      required: [seed, evaluation, timeline, groundTrack, contacts, rendezvous, events, report]
      properties:
        seed: { type: integer, format: int64 }
        evaluation: { $ref: '#/components/schemas/Evaluation' }
        timeline: { $ref: '#/components/schemas/Timeline' }
        groundTrack: { $ref: '#/components/schemas/GroundTrack' }
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        rendezvous:
          description: iss only; null otherwise
          oneOf: [{ $ref: '#/components/schemas/RendezvousProfile' }, { type: 'null' }]
        events: { type: array, items: { $ref: '#/components/schemas/MissionEvent' } }
        report: { $ref: '#/components/schemas/Report' }

    AttemptRequest:
      type: object
      required: [playerId, design, seed]
      properties:
        playerId: { type: string, format: uuid }
        design: { $ref: '#/components/schemas/Design' }
        seed: { type: integer, format: int64 }

    AttemptSummary:
      type: object
      required: [id, createdAt, seed, success, scores, bottleneck]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        seed: { type: integer, format: int64 }
        success: { type: boolean }
        scores: { $ref: '#/components/schemas/Scores' }
        bottleneck: { $ref: '#/components/schemas/Bottleneck' }

    Attempt:
      type: object
      required: [id, createdAt, playerId, design, seed, result]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        playerId: { type: string, format: uuid }
        design: { $ref: '#/components/schemas/Design' }
        seed: { type: integer, format: int64 }
        result: { $ref: '#/components/schemas/SimulationResult' }
