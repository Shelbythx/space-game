# Розгортання бекенду на Azure App Service (D105, задача 013).
# Запускається після злиття в main, якщо змінився backend/, або вручну (Run workflow).
# Потрібно в GitHub (Settings → Secrets and variables → Actions):
#   змінна  AZURE_WEBAPP_NAME             — ім'я App Service
#   секрет  AZURE_WEBAPP_PUBLISH_PROFILE  — вміст файлу Publish profile з порталу Azure
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish backend/src/SpaceGame.Api/SpaceGame.Api.csproj -c Release -o "${{ runner.temp }}/api"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api
